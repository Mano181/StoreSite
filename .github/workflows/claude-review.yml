name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Review with Claude
        id: review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 - <<'PYEOF'
          import os, json, urllib.request, subprocess, sys

          diff = subprocess.check_output(
              ['git', 'diff', 'origin/main...HEAD'], text=True
          )[:20000]

          if not diff.strip():
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write("approved=true\n")
                  f.write("review<<EOF\nNo diff — APPROVED\nEOF\n")
              sys.exit(0)

          prompt = (
              "You are reviewing a pull request for a static website "
              "(HTML/CSS/JS, Python build script). Check for: broken HTML, "
              "missing asset references, obvious JS/CSS bugs, unintended deletions.\n"
              "Reply with APPROVED on the first line if the change looks good, "
              "or CHANGES_REQUESTED on the first line followed by specific issues.\n\n"
              f"Diff:\n{diff}"
          )

          payload = json.dumps({
              "model": "claude-haiku-4-5-20251001",
              "max_tokens": 1024,
              "messages": [{"role": "user", "content": prompt}]
          }).encode()

          req = urllib.request.Request(
              'https://api.anthropic.com/v1/messages',
              data=payload,
              headers={
                  'x-api-key': os.environ['ANTHROPIC_API_KEY'],
                  'anthropic-version': '2023-06-01',
                  'content-type': 'application/json',
              }
          )
          with urllib.request.urlopen(req) as resp:
              result = json.loads(resp.read())

          text = result['content'][0]['text'].strip()
          approved = text.upper().startswith('APPROVED')

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"approved={'true' if approved else 'false'}\n")
              f.write(f"review<<REVIEWEOF\n{text}\nREVIEWEOF\n")
          PYEOF

      - name: Post review comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ICON="${{ steps.review.outputs.approved == 'true' && '✅' || '❌' }}"
          gh pr comment ${{ github.event.pull_request.number }} \
            --body "**Claude Review** $ICON

          ${{ steps.review.outputs.review }}"

      - name: Approve and merge
        if: steps.review.outputs.approved == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr review ${{ github.event.pull_request.number }} \
            --approve --body "Approved by Claude"
          gh pr merge ${{ github.event.pull_request.number }} \
            --squash --delete-branch \
            --subject "$(gh pr view ${{ github.event.pull_request.number }} --json title -q .title)"
